# Phase 2 Extension E: Standby Nginx Edge Configuration - Mac 3 (10.7.6.90)
# Used for DNS cutover & edge migration demonstration

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream backend_pool {
        server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
        server 10.7.9.188:3002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        server_name app.team_cn.test api.team_cn.test;

        ssl_certificate /usr/local/etc/nginx/certs/app.team_cn.test.crt;
        ssl_certificate_key /usr/local/etc/nginx/certs/app.team_cn.test.key;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            add_header X-Edge standby always;
        }
    }
}
