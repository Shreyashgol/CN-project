# Nginx Primary Edge & Load Balancer Configuration - Mac 2 (10.7.26.172)
# Handles SSL termination and forwards traffic to Backend A and Backend B

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Upstream pool - Round Robin load balancing
    upstream backend_pool {
        server 10.7.6.90:3001;
        server 10.7.9.188:3002;
    }

    server {
        listen 443 ssl;
        server_name app.team_cn.test api.team_cn.test;

        ssl_certificate /usr/local/etc/nginx/certs/app.team_cn.test.crt;
        ssl_certificate_key /usr/local/etc/nginx/certs/app.team_cn.test.key;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
