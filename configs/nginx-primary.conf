# Nginx Primary Edge & Load Balancer Configuration - Mac 2 (10.7.26.172)
# Updated with Phase 2 High-Availability failover parameters

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    include ssl-params.conf;

    # Upstream pool with health checks & failure thresholds
    upstream backend_pool {
        server 10.7.6.90:3001 max_fails=2 fail_timeout=10s;
        server 10.7.9.188:3002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 443 ssl;
        server_name app.team_cn.test api.team_cn.test;

        ssl_certificate /usr/local/etc/nginx/certs/app.team_cn.test.crt;
        ssl_certificate_key /usr/local/etc/nginx/certs/app.team_cn.test.key;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High-Availability failover settings
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503;
            add_header X-Edge primary always;
        }
    }
}
